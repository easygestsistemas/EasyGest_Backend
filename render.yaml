services:
  - type: web
    name: easygest-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_MONGODB_URI
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        sync: false
      - key: EASYGEST_SECURITY_USERNAME
        sync: false
      - key: EASYGEST_SECURITY_PASSWORD
        sync: false
      - key: EASYGEST_CORS_ALLOWED_ORIGINS
        sync: false
